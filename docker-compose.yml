version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - /tmp/caa-ai:/tmp/caa-ai
    depends_on:
      redis:
        condition: service_healthy

  worker-tds:
    build: .
    command: celery -A workers.celery_app worker --loglevel=info --queues=tds --concurrency=4 --hostname=tds-worker@%h
    env_file: .env
    volumes:
      - .:/app
      - /tmp/caa-ai:/tmp/caa-ai
    depends_on:
      redis:
        condition: service_healthy

  flower:
    build: .
    command: celery -A workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    depends_on:
      - redis
      - worker-tds

volumes:
  redis_data:
